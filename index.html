<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="八月计划">
<meta name="theme-color" content="#0f1117">
<title>八月过渡计划 · 2026</title>
<link rel="stylesheet" href="style.css">
  <script src="data.js"></script>
</head>
<body>

<!-- ⏸ PAUSE BANNER（模块，有数据才显示）-->
<div id="banner-module"></div>

<header>
  <h1 id="plan-title">📅 八月过渡计划</h1>
  <p class="subtitle" id="plan-subtitle">2026 年 8 月 · 离职前 20 个可利用日 · 每天 21:00—23:00</p>
  <button class="ai-cta" onclick="openAi()">🤖 AI 定制计划</button>
</header>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-card"><div class="num" id="stat-total">0</div><div class="label">总天数</div></div>
  <div class="stat-card"><div class="num" id="stat-rest">0</div><div class="label">休息日</div></div>
  <div class="stat-card"><div class="num green" id="stat-done">0</div><div class="label">已完成</div></div>
  <div class="stat-card"><div class="num" id="stat-todo">0</div><div class="label">待完成</div></div>
</div>

<!-- LEGEND -->
<div class="legend">
  <span class="legend-main"><i class="dot main"></i> 主线任务</span>
  <span class="legend-workout"><i class="dot workout"></i> 🏋️ 健身</span>
  <span class="legend-express"><i class="dot express"></i> 表达练习</span>
  <span class="legend-half"><i class="dot half-rest"></i> 半休日</span>
  <span class="legend-full"><i class="dot full-rest"></i> 纯休日</span>
  <span class="legend-milestone"><i class="dot milestone"></i> 里程碑</span>
  <span><i class="dot done"></i> 已完成</span>
  <span><i class="dot paused"></i> 暂停</span>
</div>

<!-- 🍚 DIET BANNER（模块，有数据才显示）-->
<div id="diet-module"></div>

<!-- DAILY TEMPLATE（模块，有数据才显示）-->
<div id="template-module"></div>

<!-- ═══════════════════════════════════════════════
     DESKTOP: CALENDAR TABLE
     ═══════════════════════════════════════════════ -->
<div class="desktop-only" id="desktop-calendar"></div>

<!-- ═══════════════════════════════════════════════
     MOBILE: WEEK CARD LIST
     ═══════════════════════════════════════════════ -->
<div class="mobile-only" id="mobile-calendar"></div>

<!-- REST DAY DETAILS -->
<div class="section-title">🟡🟢 休息日详情</div>
<div class="detail-grid" id="rest-detail-cards"></div>

<!-- MILESTONE CARDS -->
<div class="section-title">🔴 关键里程碑</div>
<div class="detail-grid" id="milestone-cards"></div>

<!-- CHECKLIST（模块，有数据才显示）-->
<div id="checklist-module"></div>

<footer id="footer-module"></footer>

<!-- ═══════════════ DAY DETAIL MODAL ═══════════════ -->
<div class="modal-overlay" id="detail-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="title" id="modal-title"></div>
      <button class="modal-close" onclick="closeDetail()">✕</button>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="modal-progress"></div></div>

    <div class="modal-section">
      <h4>🏷 主题标签</h4>
      <div id="modal-tags"></div>
      <div class="note-input-row">
        <input class="note-input" id="tag-input" placeholder="加个主题标签，如 数学 / 英语" onkeydown="if(event.key==='Enter')addTag()">
        <button class="note-add" onclick="addTag()">添加</button>
      </div>
    </div>

    <div class="modal-section">
      <h4>📋 今日时段</h4>
      <div id="modal-tasks"></div>
      <button class="slot-add" onclick="addSlot()">+ 添加时段</button>
    </div>

    <div class="modal-section">
      <h4>📝 我的记录</h4>
      <div id="modal-notes"></div>
      <div class="note-input-row">
        <input class="note-input" id="note-input" placeholder="记一条…回车或点添加" onkeydown="if(event.key==='Enter')addNote()">
        <button class="note-add" onclick="addNote()">添加</button>
      </div>
    </div>

    <div class="sync-row">
      <button class="sync-btn" onclick="exportData()">⬇️ 导出记录</button>
      <button class="sync-btn" onclick="document.getElementById('import-file').click()">⬆️ 导入记录</button>
      <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
    </div>
  </div>
</div>

<!-- ═══════════════ AI 定制面板 ═══════════════ -->
<div class="modal-overlay" id="ai-modal">
  <div class="modal-box">
    <div class="modal-head">
      <div class="title">🤖 AI 定制计划</div>
      <button class="modal-close" onclick="closeAi()">✕</button>
    </div>

    <div class="modal-section">
      <h4>🔑 DeepSeek API Key（存本地）</h4>
      <input id="ai-key" class="note-input" type="password" placeholder="sk-..." style="width:100%">
    </div>

    <div class="modal-section">
      <h4>🎯 目标</h4>
      <textarea id="ai-goal" class="note-input" rows="3" style="width:100%;resize:vertical" placeholder="例：9月考CPA，每天只有3小时，周末想多学点"></textarea>
    </div>

    <div class="modal-section">
      <h4>⚙️ 约束 / 偏好（可选）</h4>
      <textarea id="ai-constraint" class="note-input" rows="2" style="width:100%;resize:vertical" placeholder="例：周三晚上有事；不喜欢早起；劳逸结合"></textarea>
    </div>

    <div class="modal-section">
      <h4>📅 可利用日（点选哪几天有空）</h4>
      <div class="weekday-picker" id="weekday-picker">
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周一</button>
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周二</button>
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周三</button>
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周四</button>
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周五</button>
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周六</button>
        <button class="wd-btn on" onclick="this.classList.toggle('on')">周日</button>
      </div>
    </div>

    <div class="modal-section">
      <h4>⏰ 可用时间段</h4>
      <div id="time-slot-list">
        <input class="note-input time-slot" placeholder="如 20:00-23:00">
      </div>
      <button class="slot-add" onclick="addTimeSlot()">+ 加一段</button>
    </div>

    <button class="ai-gen" onclick="generatePlan()">✨ 生成计划</button>
    <div id="ai-status" class="empty-hint" style="margin-top:8px;"></div>

    <div class="sync-row">
      <button class="sync-btn" onclick="downloadPlan()">⬇️ 下载当前计划 JSON</button>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════════
     DATA — 改计划只改这里
     ═══════════════════════════════════════════════ -->
<script src="app.js"></script>

</body>
</html>
